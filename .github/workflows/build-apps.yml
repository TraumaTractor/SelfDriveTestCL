name: Build desktop apps

# Builds the standalone apps (Mac .dmg, Windows installer + portable .exe) and the self-update file.
# Run it by hand from the Actions tab (files appear as downloads on the run), or push a tag like v0.8.0
# (it must match the version in package.json) to publish everything on a GitHub Release. Installed
# apps look at the latest release for `app-update.json` and update themselves.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist
            artifact: Self-Drive-Test-Bench-mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: Self-Drive-Test-Bench-windows
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

  # The self-update file: the built web app packed into one JSON file.
  update-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-file
      - uses: actions/upload-artifact@v4
        with:
          name: Self-Drive-Test-Bench-update-file
          path: release/app-update.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, update-file]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-apps
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-apps/*
          # The app asks GitHub for the "latest release", which ignores drafts and pre-releases,
          # so always publish as a normal, latest release (even if it was created as a pre-release).
          draft: false
          prerelease: false
          make_latest: 'true'
