name: Build Mac app

# Builds the standalone macOS app (.dmg) on a Mac runner. Run it by hand from the Actions tab,
# or push a tag like v0.5.0 to also attach the .dmg to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build
      - uses: actions/upload-artifact@v4
        with:
          name: Self-Drive-Test-Bench-mac
          path: release/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
